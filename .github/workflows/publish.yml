# Publishes to nuget.org when a release tag (vX.Y.Z) is pushed, through NuGet
# Trusted Publishing: no API key is stored anywhere. nuget.org hands out a
# key that lasts one hour, and only to this repository, this workflow file and
# the `nuget` environment. nuget.org signs every package it accepts.
# Only SuperSemantics.Vsl.AgentFramework is packed and pushed: SuperSemantics.Vsl
# builds from the submodule but is published from its own repository.
# A version that is already on nuget.org is skipped, not failed.
name: Publish to NuGet

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write      # the NuGet login exchanges it for a one-hour key
    env:
      PROJECT: src/SuperSemantics.Vsl.AgentFramework/SuperSemantics.Vsl.AgentFramework.csproj
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test -c Release
      - name: Check the tag matches the version
        run: |
          version=$(dotnet msbuild "$PROJECT" -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Directory.Build.props"; exit 1
          fi
      - name: Pack
        run: >-
          dotnet pack "$PROJECT" -c Release -o dist
          -p:ContinuousIntegrationBuild=true
          -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
      - name: Check only the adapter was packed
        run: |
          ls dist
          if ls dist | grep -v '^SuperSemantics\.Vsl\.AgentFramework\.' ; then
            echo "Unexpected package in dist/"; exit 1
          fi
      - uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push, unless this version is already on nuget.org
        run: >-
          dotnet nuget push "dist/*.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
